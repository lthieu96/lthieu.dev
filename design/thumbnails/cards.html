<!doctype html><html><head><style>
@font-face{font-family:Geist;src:url(../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
body{margin:0;background:#666;display:flex;flex-direction:column;gap:20px;padding:20px;font-family:Geist}
.c{width:640px;height:400px;position:relative;overflow:hidden;display:grid;place-items:center}
.cerebro{background:radial-gradient(80% 90% at 30% 70%,#1d1733 0%,#07070a 60%),#07070a;color:#fff}
.cerebro .in{display:flex;flex-direction:column;align-items:center;gap:22px}
.cerebro img{width:440px}
.cerebro p{margin:0;font-size:22px;letter-spacing:-.1px;color:#b4b4c0}
.benkon{background:linear-gradient(160deg,#f7fbff 0%,#e3eefb 100%)}
.benkon img{width:520px}
.gm{background:linear-gradient(160deg,#f7f9f5 0%,#e5eee6 100%)}
.gm img{width:360px}
.dots{position:absolute;inset:0;background-image:radial-gradient(currentColor 1px,transparent 1.2px);background-size:14px 14px;opacity:.07;mask:radial-gradient(70% 70% at 50% 50%,transparent 40%,#000 100%)}
.benkon .dots{color:#1f5fbf}.gm .dots{color:#003824}.cerebro .dots{color:#fff;opacity:.06}
</style></head><body>
<div class="c cerebro" id="cerebro"><div class="dots"></div><div class="in"><img src="cer-logo.svg"><p>All your crypto in one place</p></div></div>
<div class="c benkon" id="benkon"><div class="dots"></div><img src="bk-benkon-official-logo.png"></div>
<div class="c gm" id="greenmaster"><div class="dots"></div><img src="gm-main-logo.png"></div>
</body></html>
